worker_processes 1;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/error.log warn;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Known scrapers that often ignore robots.txt. Keep in sync with config/crawlers.php.
    map $http_user_agent $blocked_crawler {
        default 0;
        ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|anthropic-ai|Google-Extended|CCBot|Bytespider|Amazonbot|Applebot-Extended|meta-externalagent|PetalBot|AhrefsBot|SemrushBot|DotBot|MJ12bot|Scrapy) 1;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Railway-specific configuration for large uploads
    # These headers help Railway understand our upload requirements
    add_header X-Railway-Upload-Size-Limit "100M" always;

    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 8080;
        server_name _;
        root /var/www/public;
        index index.php;

        # Allow larger uploads for photo uploads
        client_max_body_size 100M;

        # Direct health check that doesn't rely on PHP
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        # Always serve robots.txt so crawlers can read Disallow: /
        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        # Block common vulnerability scanner paths - return 404 immediately, no PHP
        location ~* ^/(update|delete|backup|dump|restore)\.sql$ { return 404; }
        location ~* ^/(sample|example|\.)\.env$ { return 404; }
        location ~* ^/(example|sample)-config\.php$ { return 404; }
        location ~* \.(sql|env|bak|sqlite|sqlite3)$ { return 404; }
        location ~* ^/(wp-login\.php|wp-admin|xmlrpc\.php|wp-content|wp-includes) { return 404; }
        location ~* ^/(phpmyadmin|pma|adminer)(/|$) { return 404; }
        location ~* /\.git { return 404; }
        location ~* ^/(vendor/phpunit|phpunit) { return 404; }
        location ~* ^/(cgi-bin|manager/html) { return 404; }

        location / {
            if ($blocked_crawler) {
                return 403;
            }
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Serve fonts directly
        location ~* \.(woff|woff2|ttf|eot)$ {
            expires max;
            add_header Cache-Control "public, max-age=31536000";
        }

        location ~ \.php$ {
            if ($blocked_crawler) {
                return 403;
            }
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_read_timeout 300;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
